name = "study-dashboard-api"
main = "index.js"
compatibility_date = "2026-01-01"

[triggers]
# Cloudflare Cron uses UTC: 16:10 UTC = next day 00:10 Asia/Taipei.
# Cron is declared below, but this file cannot confirm the live Cloudflare schedule.
# Deploying this configuration may activate scheduled writes; verify and review first.
crons = ["10 16 * * *"]

[[durable_objects.bindings]]
name = "LESSON_AUTOMATION"
class_name = "LessonAutomationCoordinator"

[[migrations]]
tag = "lesson-automation-v1"
new_sqlite_classes = ["LessonAutomationCoordinator"]

[vars]
# Origin of the GitHub Pages site, e.g. https://chan0ir.github.io  ("*" = any)
ALLOWED_ORIGIN = "https://chan0ir.github.io"

# Secrets (NOT stored here):
#   wrangler secret put NOTION_TOKEN
#   wrangler secret put APP_KEY

# 回想室掛載於同一 Worker origin 的 /recall/；專用正式 D1。
[[d1_databases]]
binding = "DB"
database_name = "recall-room-accounts"
database_id = "ca84bad4-b5ad-4534-9b55-ed69ba063f51"
migrations_dir = "./recall/migrations"

# Keep the production dashboard logging settings on subsequent Wrangler deploys.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
