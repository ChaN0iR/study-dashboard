<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="讀書">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<title>清大後醫</title>
</head>
<body>
<header class="top">
  <div><h1><a class="title-link" href="https://adms.site.nthu.edu.tw/p/412-1207-19247.php?Lang=zh-tw" target="_blank" rel="noopener">清大後醫</a></h1><div id="date" class="muted"></div></div>
  <span class="top-actions"><a id="gd-link" class="icon-btn" aria-label="高點正課" title="高點正課" href="https://www.ibrain.com.tw/Service/OrderForm/OrderFormList.aspx" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M10 8.5v5l4-2.5zM8 21h8M12 17v4"/></svg></a><a id="wk-link" class="icon-btn" aria-label="高點微課" title="高點微課" href="https://member.get.com.tw/coursera/Web/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 9v5l3.5-2.5zM10.5 18.5h3"/></svg></a><a id="ypt-link" class="icon-btn" aria-label="YPT" title="YPT" href="https://link.yeolpumta.com/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2.5h6"/></svg></a><a id="anki-link" class="icon-btn" aria-label="Anki" title="Anki" href="https://ankiweb.net/decks" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3"/></svg></a><a id="notion-link" class="icon-btn" aria-label="Notion" title="Notion" href="https://app.notion.com/p/3f879ed2087381a99750c654a4aa4186" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M9 16V8l6 8V8"/></svg></a><button id="refresh" class="icon-btn" aria-label="重新整理"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/></svg></button></span>
</header>
<div id="banner" class="banner" hidden></div>
<main>
  <section id="now" class="card"></section>

  <section class="card">
    <h2>今日任務 <span id="task-count" class="muted"></span></h2>
    <ul id="tasks" class="list"></ul>
    <details id="skipped-wrap" hidden><summary>已跳過</summary><ul id="skipped" class="list"></ul></details>
  </section>

  <section class="card">
    <h2>今日進度 <span id="completion" class="muted"></span></h2>
    <div class="row2">
      <label>小時<input id="f-hours" type="number" inputmode="decimal" min="0" max="24" step="0.25" placeholder="1.5"></label>
      <label>分鐘<input id="f-minutes" type="number" inputmode="numeric" min="0" max="1440" step="1" placeholder="40"></label>
    </div>
    <div class="total">YPT 合計 <b id="ypt">0h00m</b></div>
    <div class="moods" id="moods" role="radiogroup" aria-label="心情"></div>
    <label>心得<textarea id="f-review" rows="3"></textarea></label>
    <label>各科重點<textarea id="f-points" rows="3"></textarea></label>
    <button id="save-record" class="primary">儲存進度</button>
  </section>

  <section class="card">
    <h2>課程 <span id="lesson-count" class="muted"></span></h2>
    <ul id="lessons" class="list"></ul>
  </section>

  <section class="card">
    <h2>筆記快速新增</h2>
    <label>標題<input id="n-title" type="text"></label>
    <label>科目<select id="n-subject"><option value="">不指定</option></select></label>
    <label>重點<textarea id="n-points" rows="3"></textarea></label>
    <button id="save-note" class="primary">新增筆記</button>
  </section>
  <footer class="muted foot"><a href="#" id="reset-key">重設 APP_KEY / API 位址</a><span id="mode"></span></footer>
</main>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
