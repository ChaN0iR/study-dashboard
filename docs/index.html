<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="讀書">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=82">
<title>清大後醫</title>
</head>
<body>
<header class="top">
  <div><h1><a class="title-link" href="https://adms.site.nthu.edu.tw/p/412-1207-19247.php?Lang=zh-tw" target="_blank" rel="noopener">清大後醫</a><span id="countdown" class="countdown"></span></h1><div id="date" class="muted"></div></div>
  <span class="top-actions"><a id="gd-link" class="icon-btn" aria-label="高點正課" title="高點正課" href="https://www.ibrain.com.tw/Service/OrderForm/OrderFormList.aspx" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M10 8.5v5l4-2.5zM8 21h8M12 17v4"/></svg></a><a id="wk-link" class="icon-btn" aria-label="高點微課" title="高點微課" href="https://member.get.com.tw/coursera/Web/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 9v5l3.5-2.5zM10.5 18.5h3"/></svg></a><a id="anki-link" class="icon-btn" aria-label="Anki" title="Anki" href="https://ankiweb.net/decks" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3"/><path d="M7 18l2.5-6.5L12 18M7.9 16h3.2" stroke-width="1.6"/></svg></a><a id="notion-link" class="icon-btn" aria-label="Notion" title="Notion" href="https://app.notion.com/p/3f879ed2087381a99750c654a4aa4186" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M9 16V8l6 8V8"/></svg></a><a id="hevy-link" class="icon-btn" aria-label="Hevy" title="Hevy" href="https://hevy.com/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8v8M17.5 8v8M3.5 10v4M20.5 10v4M6.5 12h11"/></svg></a></span>
</header>
<div id="banner" class="banner" hidden></div>
<main>
<div class="col">
  <section id="now" class="card" data-tab="today"></section>

  <section class="card focus" id="focus" data-tab="record">
    <div class="fc-head"><h2>열품타</h2>
      <button type="button" class="fc-seg fc-tog" id="fc-mode" aria-label="切換今日或本段">今日</button>
      <button class="fc-hist" id="fc-hist" aria-label="열품타 紀錄" title="紀錄"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="17" r="3.5"/><path d="M18 15.6v1.6l1 .6"/></svg></button></div>
    <div class="fc-time" id="fc-time">0:00:00</div>
    <div class="fc-goal"><div class="prog fc-prog"><i id="fc-prog-i"></i></div><span id="fc-goal-t" class="muted"></span></div>
    <div class="fc-sub muted" id="fc-sub"></div>
    <div class="fc-subj" id="fc-subj"><button data-s="英文"><span>英文</span><i></i></button><button data-s="化學"><span>化學</span><i></i></button><button data-s="生物"><span>生物</span><i></i></button><button data-s="物理"><span>物理</span><i></i></button><button data-s="生化"><span>生化</span><i></i></button></div>
  </section>

  <section class="card" data-tab="today">
    <h2>今日任務 <span id="task-count" class="muted"></span></h2>
    <ul id="tasks" class="list"></ul>
    <details id="skipped-wrap" hidden><summary>已跳過</summary><ul id="skipped" class="list"></ul></details>
  </section>

</div>
<div class="col">
  <section class="card rec" data-tab="record">
    <div class="rec-head"><h2>今日進度</h2><span id="completion" class="muted"></span></div>
    <div class="prog"><i id="prog-i"></i></div>
    <div hidden><input id="f-hours" type="number" inputmode="decimal" min="0" max="24" step="0.25" placeholder="0"><input id="f-minutes" type="number" inputmode="numeric" min="0" max="1440" step="1" placeholder="0"><b id="ypt"></b></div>
    <div class="moods seg" id="moods" role="radiogroup" aria-label="心情"></div>
    <div class="fields">
      <label class="fld"><span>日記</span><textarea id="f-review" rows="3" placeholder="今日狀態與感想、運動（內容・步數・單車）、飲食與睡眠、明日要改進的一件事"></textarea></label>
      <textarea id="f-workout" hidden></textarea>
      <label class="fld"><span>重點</span><textarea id="f-points" rows="2" placeholder="各科重點與需記憶處"></textarea></label>
    </div>
    <button id="save-record" class="primary">儲存進度</button>
  </section>

  <section class="card note-card" data-tab="notes">
    <h2>快速筆記</h2>
    <div class="note-row">
      <input id="n-title" type="text" placeholder="標題">
      <select id="n-subject" aria-label="科目"><option value="">科目</option></select>
    </div>
    <ul id="n-draft" class="n-draft"></ul>
    <div class="note-row">
      <textarea id="n-points" rows="1" placeholder="寫下內容，可一直補充"></textarea>
      <button id="n-add" class="ghost" type="button">換頁</button>
      <button id="n-photo" class="ghost" type="button">照片</button>
      <input id="n-file" type="file" accept="image/*" multiple hidden>
    </div>
    <div class="note-row">
      <button id="save-note" class="primary">送出筆記</button>
      <button id="n-clear" class="ghost" type="button">清除</button>
    </div>
  </section>
</div>
<div class="col">
  <section class="card" data-tab="lessons">
    <h2>課程 <span id="lesson-count" class="muted"></span></h2>
    <ul id="lessons" class="list"></ul>
  </section>

</div>
  <footer class="muted foot" data-tab="notes"><a href="#" id="reset-key">重設 APP_KEY / API 位址</a><span id="mode"></span></footer>
</main>
<nav id="tabs" class="tabs"><button data-t="today" aria-selected="true">今日</button><button data-t="record">進度</button><button data-t="lessons">課程</button><button data-t="notes">筆記</button></nav>
<dialog id="fc-dialog" class="fc-dialog"><div class="fc-dh"><h2>열품타 紀錄</h2><button class="ghost" id="fc-close">關閉</button></div><div id="fc-body"></div></dialog>
<div id="toast" class="toast" hidden></div>
<script src="config.js?v=82"></script>
<script src="app.js?v=82"></script>
<script>(function(){var b=document.querySelectorAll("#tabs button");function go(t){document.body.dataset.tab=t;b.forEach(function(x){x.setAttribute("aria-selected",x.dataset.t==t)})}b.forEach(function(x){x.onclick=function(){go(x.dataset.t)}});go("today")})()</script>
</body>
</html>
