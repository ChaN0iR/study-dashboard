name: Dashboard bounded request regression

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/index.js"
      - "worker/request-body.js"
      - "worker/test.mjs"
      - ".github/workflows/dashboard-request-limit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-limit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        working-directory: worker
      - name: Validate committed source
        run: |
          node --check worker/index.js
          node --check worker/request-body.js
          node --check worker/test.mjs
          git diff --check origin/main...HEAD
      - name: Mocked Dashboard API boundary test
        run: node worker/test.mjs
