name: PR43 staging HTTPS read-only verification

on:
  pull_request:
    branches:
      - integration/pwa-v2-offline-optin
    paths:
      - ".github/workflows/pr43-public-readonly-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-pages-readonly:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 44 && github.event.pull_request.head.ref == 'staging/pr43-iphone-synthetic-preview') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      STAGING_ORIGIN: https://study-dashboard-pr43-synth-20261029.pages.dev
      EXPECTED_SW_SHA256: 38f9b999064b0ec58f59db68458add1892232978275fe331ca5abe899cabaec0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public staging origin without changing any resources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.parse, urllib.request

          root = os.environ["STAGING_ORIGIN"].rstrip("/")
          expected = os.environ["EXPECTED_SW_SHA256"]
          assert root == "https://study-dashboard-pr43-synth-20261029.pages.dev"
          assert root.endswith(".pages.dev")
          results = {}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          def check(name, path, expected_status, validator=None, attempts=1):
              url = root + path
              assert urllib.parse.urlsplit(url).hostname == "study-dashboard-pr43-synth-20261029.pages.dev"
              for n in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "study-dashboard-pr43-readonly-check/1.0",
                          "Cache-Control": "no-cache",
                      }, method="GET")
                      try:
                          response = opener.open(req, timeout=15)
                      except urllib.error.HTTPError as exc:
                          response = exc
                      with response:
                          status = response.getcode()
                          body = response.read(512_000)
                          headers = dict(response.headers.items())
                      break
                  except Exception as e:
                      if n == attempts - 1:
                          raise AssertionError(f"{name}: network access failed: {type(e).__name__}: {e}")
                      time.sleep(4)
              item = {
                  "status": status, "content_type": headers.get("Content-Type", ""),
                  "bytes": len(body)
              }
              if validator:
                  item.update(validator(body, {k.lower():v for k,v in headers.items()}))
              results[name] = item
              assert status == expected_status, f"{name}: expected {expected_status}, got {status}: {item}"
              return body, {k.lower():v for k,v in headers.items()}

          def html_check(body, headers):
              html = body.decode("utf-8")
              assert "PR #43 · STAGING ONLY" in html, "Missing STAGING ONLY banner; wrong upload or ZIP nesting"
              assert 'id="pr43-qa-open"' in html, "Missing acceptance button"
              assert "PR43_STAGING_DIAGNOSTICS" in html, "Missing embedded acceptance harness"
              assert "study-dashboard-api.tw-ching.workers.dev" not in html
              csp = headers.get("content-security-policy", "")
              robots = headers.get("x-robots-tag", "")
              assert "default-src 'self'" in csp and "connect-src 'self'" in csp and "frame-ancestors 'none'" in csp, f"Missing strict response CSP: {csp}"
              assert "noindex" in robots.lower(), f"Missing X-Robots-Tag: {robots}"
              return {"banner": True, "qa": True, "header_CSP": True, "noindex": True}

          def sw_check(body, headers):
              found = hashlib.sha256(body).hexdigest()
              assert found == expected, f"Wrong SW SHA: expected {expected}, found {found}"
              assert b'const CACHE = "sd-v138";' in body
              return {"sha256": found, "cache": "sd-v138", "exact_candidate": True}

          def config_check(body, headers):
              text = body.decode("utf-8")
              assert '"API_BASE": ""' in text, "Live API_BASE found"
              assert '"DONE_TITLES": {}' in text and '"SCHEDULE": []' in text
              assert "study-dashboard-api" not in text
              return {"synthetic_only": True}

          def manifest_check(body, headers):
              manifest = json.loads(body)
              assert manifest["short_name"] == "PR43測試"
              assert manifest["display"] == "standalone"
              return {"short_name": manifest["short_name"], "standalone": True}

          try:
              check("homepage", "/", 200, html_check, attempts=4)
              check("canonical_index", "/index.html", 200)
              check("original_sw", "/sw.js", 200, sw_check)
              check("synthetic_config", "/config.js?v=90", 200, config_check)
              check("manifest", "/manifest.webmanifest?v=stethoscope-1", 200, manifest_check)
              check("v2_js", "/ui-live-v2.js", 200)
              check("v2_css", "/ui-live-v2.css?v=1", 200)
              check("disabled_private_endpoint", "/api/pr43-synthetic-private", 404)
              check("unknown_path", "/pr43-nonexistent-route", 404)
              assert "javascript" in results["v2_js"]["content_type"].lower(), "V2 JS MIME mismatch"
              assert "text/css" in results["v2_css"]["content_type"].lower(), "V2 CSS MIME mismatch"
          finally:
              print("PR43_STAGING_READONLY_RESULTS=" + json.dumps(results, ensure_ascii=False, sort_keys=True), flush=True)
          print("PR43_REMOTE_STAGING_VERIFIED=PASS")
          print("No Cloudflare write operations, no production requests, no secrets, no Notion calls")
          PY
