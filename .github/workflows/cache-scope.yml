name: Dashboard cache ownership regression

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/sw.js"
      - "docs/index.html"
      - "docs/app.js"
      - "docs/ui-live-v2.js"
      - "docs/ui-live-v2.css"
      - "docs/cache-scope.test.mjs"
      - "docs/recall-icon.test.mjs"
      - "docs/service-worker-security.test.mjs"
      - "docs/service-worker-privacy.browser.py"
      - "docs/desktop-cards.test.mjs"
      - "docs/timer-layout.test.mjs"
      - ".github/workflows/cache-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent browser dependencies
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==12.0.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable = p.chromium.executable_path
          Path('/usr/local/bin/chromium').symlink_to(executable)
          print('Chromium:', executable)
          PY
          chromium --version
      - name: Verify code syntax and whitespace
        run: |
          node --check docs/app.js
          node --check docs/sw.js
          node --check docs/desktop-cards.test.mjs
          git diff --check origin/main...HEAD
          python -m py_compile docs/service-worker-privacy.browser.py
      - name: Cache lifecycle and real browser upgrade regression
        shell: bash
        env:
          RECALL_ICON_SCREENSHOTS: ${{ runner.temp }}/cache-evidence
        run: |
          mkdir -p "$RECALL_ICON_SCREENSHOTS"
          set +e
          node --test --test-concurrency=1 docs/cache-scope.test.mjs docs/recall-icon.test.mjs docs/service-worker-security.test.mjs > "$RUNNER_TEMP/cache-scope.tap" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/cache-scope.tap"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python - "$RUNNER_TEMP/cache-scope.tap" <<'PYVERIFY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          def count(key):
              match = re.search(r'^[ℹ#]\s*'+key+r'\s+(\d+)\s*$', text, re.M)
              if not match: raise SystemExit('Missing TAP summary: '+key)
              return int(match.group(1))
          if count('tests') != 14 or count('fail') or count('skipped') or count('cancelled'):
              raise SystemExit('All 14 cache/privacy/recall tests must run and pass')
          PYVERIFY
      - name: Verify no private runtime response persists in real Chromium
        run: python3 docs/service-worker-privacy.browser.py | tee "$RUNNER_TEMP/pwa-private-response.json"
      - name: Upload cache regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-scope-evidence
          path: |
            ${{ runner.temp }}/cache-scope.tap
            ${{ runner.temp }}/pwa-private-response.json
            ${{ runner.temp }}/cache-evidence/
          if-no-files-found: error
          retention-days: 14
