name: Dashboard docs and browser validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "scriptable-widget.js"
      - "scripts/production-smoke.py"
      - ".github/workflows/pr29-independent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent browser dependencies
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==12.0.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable = p.chromium.executable_path
          Path('/usr/local/bin/chromium').symlink_to(executable)
          print('Chromium:', executable)
          PY
          chromium --version
      - name: Verify code syntax and whitespace
        run: |
          node --check docs/app.js
          node --check docs/sw.js
          node --check docs/desktop-cards.test.mjs
          git diff --check
      - name: Independently run desktop card and browser tests
        run: node --test docs/desktop-cards.test.mjs
      - name: Run complete docs suite without failures or skips
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 docs/*.test.mjs > "$RUNNER_TEMP/docs-suite.tap" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/docs-suite.tap"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python - "$RUNNER_TEMP/docs-suite.tap" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          def count(key):
              match = re.search(r'^[ℹ#]\s*'+key+r'\s+(\d+)\s*$', text, re.M)
              if not match: raise SystemExit('Missing TAP summary: '+key)
              return int(match.group(1))
          if count('tests') == 0 or count('fail') != 0 or count('skipped') != 0 or count('cancelled') != 0:
              raise SystemExit('Docs suite must run with no failures, skips or cancellations')
          print('Complete docs suite passed; no baseline failure exemption')
          PY
      - name: Upload independent docs evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-docs-tap
          path: ${{ runner.temp }}/docs-suite.tap
          if-no-files-found: ignore
          retention-days: 7
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for production checks
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Verify current production release, desktop, mobile and offline cache
        run: python scripts/production-smoke.py --release-sha "$(git rev-parse origin/main)" --wait-seconds 240
      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: production-smoke-evidence/
          if-no-files-found: error
          retention-days: 14
