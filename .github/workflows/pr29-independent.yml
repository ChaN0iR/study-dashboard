name: PR 29 independent desktop cards validation

on:
  push:
    branches:
      - feature/desktop-cards-exclusive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent browser dependencies
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==12.0.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable = p.chromium.executable_path
          Path('/usr/local/bin/chromium').symlink_to(executable)
          print('Chromium:', executable)
          PY
          chromium --version
      - name: Verify code syntax and whitespace
        run: |
          node --check docs/app.js
          node --check docs/sw.js
          node --check docs/desktop-cards.test.mjs
          git diff --check
      - name: Independently run desktop card and browser tests
        run: node --test docs/desktop-cards.test.mjs
      - name: Independently run docs suite, allowing only the documented baseline failure
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 docs/*.test.mjs > "$RUNNER_TEMP/docs-suite.tap" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/docs-suite.tap"
          if [ "$status" -eq 0 ]; then
            echo "All docs tests passed"
            exit 0
          fi
          python - "$RUNNER_TEMP/docs-suite.tap" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          def count(key):
              match = re.search(r'^[ℹ#]\s*'+key+r'\s+(\d+)\s*$', text, re.M)
              if not match: raise SystemExit('Missing TAP summary: '+key)
              return int(match.group(1))
          if count('fail') != 1 or count('skipped') != 0:
              raise SystemExit('Unexpected docs failures or skips')
          if 'context.widgetTaskModel is not a function' not in text:
              raise SystemExit('Failure differs from tracked baseline Issue #30')
          if 'Scriptable 維持原有休息日模型與三餐過濾' not in text:
              raise SystemExit('Known baseline test not identified')
          print('Only known baseline failure (Issue #30); no other docs regressions')
          PY
      - name: Upload independent docs evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr29-independent-docs-tap
          path: ${{ runner.temp }}/docs-suite.tap
          if-no-files-found: ignore
          retention-days: 7
