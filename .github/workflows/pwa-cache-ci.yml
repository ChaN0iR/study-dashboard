name: PWA Cache Safety (Offline)

on:
  pull_request:
    branches: [main, codex/pwa-sensitive-cache-guard, codex/integration-backend-ci, codex/security-full-stack-validation]
    paths:
      - 'docs/**'
      - '.github/workflows/pwa-cache-ci.yml'

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  cache-safety:
    name: Service Worker security and PWA contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # historical baseline checks
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Run offline Service Worker and PWA contracts
        run: |
          node --test docs/service-worker-security.test.mjs \
            docs/recall-icon.test.mjs \
            docs/desktop-cards.test.mjs \
            docs/timer-layout.test.mjs
