name: Live UI V2 opt-in regression

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/app.js"
      - "docs/ui-live-v2.js"
      - "docs/ui-live-v2.css"
      - "docs/ui-live-v2.test.mjs"
      - "docs/ui-live-v2.browser.py"
      - ".github/workflows/live-ui-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax, formatting, and read-only UI contracts
        run: |
          git diff --check origin/main...HEAD
          node --check docs/app.js
          node --check docs/ui-live-v2.js
          node --check docs/ui-live-v2.test.mjs
          python -m py_compile docs/ui-live-v2.browser.py
          node --test docs/ui-live-v2.test.mjs
      - name: Install independent browser
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Chromium real-app demo and synthetic API rejection tests
        env:
          LIVE_UI_V2_EVIDENCE: ${{ runner.temp }}/live-ui-v2
        run: |
          mkdir -p "$LIVE_UI_V2_EVIDENCE"
          python docs/ui-live-v2.browser.py | tee "$RUNNER_TEMP/live-ui-v2-results.json"
      - name: Attach screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-v2-evidence
          path: |
            ${{ runner.temp }}/live-ui-v2/
            ${{ runner.temp }}/live-ui-v2-results.json
          if-no-files-found: warn
          retention-days: 14
