name: Note Validation Offline CI (Experimental)

on:
  pull_request:
    branches: [codex/pr-02-security-coverage]
    paths:
      - 'worker/**'
      - '.github/workflows/note-validation-ci.yml'

permissions:
  contents: read

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  note-validation:
    name: Offline note validation and Worker regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install locked dependencies with scripts disabled
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full offline Worker test suite (includes image prevalidation)
        run: npm test
      - name: Bundle only; never deploy
        run: ./node_modules/.bin/wrangler deploy --dry-run
