name: Isolated note and PWA candidate integration

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/candidate-integration.yml"

permissions:
  contents: read

jobs:
  isolated-integration:
    if: github.head_ref == 'fix/notion-note-upload-before-create'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PWA_CANDIDATE: bd9fe2107998d693a87578906962a520327fa85e
      COMMON_BASE: d96c45cc8008e21a1c5ca71e099e84c453586e9f
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble pinned candidates without creating a commit or updating any ref
        shell: bash
        run: |
          set -euo pipefail
          test "$CURRENT_BASE" = "$COMMON_BASE"
          git cat-file -e "$PWA_CANDIDATE^{commit}"
          test "$(git merge-base HEAD "$PWA_CANDIDATE")" = "$COMMON_BASE"
          tree="$(git merge-tree --write-tree HEAD "$PWA_CANDIDATE")"
          mkdir -p "$RUNNER_TEMP/candidate-integration" "$RUNNER_TEMP/candidate-evidence"
          git archive "$tree" | tar -x -C "$RUNNER_TEMP/candidate-integration"
          CANDIDATE_TREE="$tree" NOTE_CANDIDATE="$(git rev-parse HEAD)" python - <<'PY'
          import json, os, pathlib
          data = {key: os.environ[key] for key in ['COMMON_BASE', 'CURRENT_BASE', 'NOTE_CANDIDATE', 'PWA_CANDIDATE', 'CANDIDATE_TREE']}
          data.update(scope='ephemeral offline candidate integration', deployed=False, live_notion=False)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate-evidence' / 'inputs.json'
          path.write_text(json.dumps(data, indent=2) + '\n')
          print(path.read_text())
          PY
      - name: Install locked Worker and independent browser dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/candidate-integration/worker"
          python -m pip install 'playwright==1.56.0' 'Pillow==12.0.0'
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/candidate-bin"
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              Path(os.environ['RUNNER_TEMP'], 'candidate-bin', 'chromium').symlink_to(p.chromium.executable_path)
          PY
          echo "$RUNNER_TEMP/candidate-bin" >> "$GITHUB_PATH"
      - name: Verify combined Worker and default no-network staging plan
        shell: bash
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate-integration/worker"
          npm test | tee "$RUNNER_TEMP/candidate-evidence/worker.log"
          node note-staging-acceptance.mjs | tee "$RUNNER_TEMP/candidate-evidence/staging-plan.json"
          ./node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/candidate-bundle" | tee "$RUNNER_TEMP/candidate-evidence/bundle.log"
      - name: Verify combined frontend without skips and real Chromium privacy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate-integration"
          node --test --test-concurrency=1 docs/*.test.mjs > "$RUNNER_TEMP/candidate-evidence/docs.tap" 2>&1
          cat "$RUNNER_TEMP/candidate-evidence/docs.tap"
          python - <<'PY'
          import os, pathlib, re
          text = pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate-evidence', 'docs.tap').read_text()
          def count(key):
              match = re.search(r'^[ℹ#]\s*'+key+r'\s+(\d+)\s*$', text, re.M)
              if not match: raise SystemExit('Missing test summary: '+key)
              return int(match.group(1))
          if count('tests') != 129 or count('pass') != 129 or any(count(key) for key in ['fail', 'skipped', 'cancelled']):
              raise SystemExit('Pinned candidate frontend must pass all 129 tests without skips')
          PY
          python docs/service-worker-privacy.browser.py | tee "$RUNNER_TEMP/candidate-evidence/privacy.jsonl"
      - name: Upload exact inputs and combined verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-candidate-integration-evidence
          path: ${{ runner.temp }}/candidate-evidence/
          if-no-files-found: error
          retention-days: 14
